name: Build

# push 到 main/master：三平台打包，产物存为 Actions Artifacts（供测试）
# push 标签 v*：三平台打包并把安装包发布到 GitHub Release
# 也可在 Actions 页面手动触发（workflow_dispatch）
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      # electron / electron-builder 二进制缓存目录（各平台统一的固定路径）
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      # macOS 无证书签名，跳过签名探测
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-eb-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-eb-

      - name: 安装依赖
        run: npm ci

      - name: 数据管道测试
        run: npm test

      - name: 打包当前平台
        run: npx electron-builder --publish never

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 汇总三平台产物
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## 下载说明

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows | `*-win-x64.exe` | NSIS 安装包（可选安装目录） |
            | Windows | `*-win-x64.zip` | 便携版，解压即用 |
            | macOS | `*-mac-arm64.dmg` | Apple Silicon (M1/M2/M3/M4) |
            | macOS | `*-mac-x64.dmg` | Intel 芯片 |
            | Linux | `*-linux-x86_64.AppImage` | `chmod +x` 后直接运行 |
            | Linux | `*-linux-amd64.deb` | Debian/Ubuntu 系安装包 |

            > macOS 应用未做代码签名：首次打开如提示「已损坏/无法验证开发者」，
            > 请右键应用 → 「打开」，或执行 `xattr -cr /Applications/数据图表浏览器.app`。
